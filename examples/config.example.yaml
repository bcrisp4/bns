listen:
  udp: ":53"
  tcp: ":53"
  query_timeout: 5s

upstreams:
  - type: udp
    addr: 1.1.1.1:53
    timeout: 2s

  - type: doh
    url: https://cloudflare-dns.com/dns-query
    endpoint_ips: [1.1.1.1, 1.0.0.1]
    timeout: 5s

cache:
  capacity: 10000
  min_ttl: 0s
  max_ttl: 86400s
  negative_ttl_max: 900s

blocklists:
  refresh_interval: 24h
  cache_dir: /var/cache/bns/blocklists
  sources:
    - type: http
      name: hagezi-pro
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt
    - type: file
      name: custom-blocklist
      path: ./examples/sample-blocklist.txt

admin:
  listen: ":9090"

logging:
  level: debug
  format: json
  query_log:
    enabled: true

shutdown_timeout: 5s
startup_probe_timeout: 3s
